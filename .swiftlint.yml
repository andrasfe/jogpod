# SwiftLint Configuration for JogPod iOS Migration Project
# Documentation: https://github.com/realm/SwiftLint

# Paths to include during linting
included:
  - Sources
  - Models
  - Tests
  - JogPod
  - JogPodTests
  - JogPodUITests

# Paths to exclude from linting
excluded:
  - Pods
  - Carthage
  - .build
  - build
  - DerivedData
  - vendor
  - Package.swift
  - "*/Generated/*"
  - "*/Snapshots/*"
  - "**/*generated*"
  - .claude

# Enabled rules not included in the default set
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - number_separator
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# Rules to disable
disabled_rules:
  - todo # Allow TODO comments during active development
  - trailing_whitespace # Too noisy during development
  - identifier_name # Custom naming conventions for migration

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true
  ignores_interpolated_strings: true

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

function_parameter_count:
  warning: 6
  error: 8
  ignores_default_parameters: true

nesting:
  type_level:
    warning: 3
    error: 5
  function_level:
    warning: 3
    error: 5

type_name:
  min_length:
    warning: 3
    error: 1
  max_length:
    warning: 50
    error: 70
  allowed_symbols: ["_"]
  validates_start_with_lowercase: error

# Allow force unwrapping in test files
force_unwrapping:
  severity: warning

force_cast:
  severity: warning

force_try:
  severity: warning

# Multiline rules
multiline_arguments:
  first_argument_location: next_line
  only_enforce_after_first_closure_on_first_line: true

multiline_parameters:
  allowance: 1

vertical_whitespace:
  max_empty_lines: 2

trailing_comma:
  mandatory_comma: true

# Large tuple threshold
large_tuple:
  warning: 3
  error: 4

# Colon spacing
colon:
  apply_to_dictionaries: true

# Custom rules for iOS development
custom_rules:
  no_print_in_production:
    name: "No print() in production code"
    regex: "print\\s*\\("
    match_kinds:
      - identifier
    message: "Use os_log or Logger instead of print() for production code"
    severity: warning
    excluded: ".*Tests?\\.swift$"

  no_nslog:
    name: "No NSLog"
    regex: "NSLog\\s*\\("
    match_kinds:
      - identifier
    message: "Use os_log or Logger instead of NSLog"
    severity: warning

  no_hardcoded_strings_in_ui:
    name: "Avoid hardcoded UI strings"
    regex: '\\.text\s*=\s*"[^"]+"|\.title\s*=\s*"[^"]+"'
    message: "Consider using localized strings for UI text"
    severity: warning
    excluded: ".*Tests?\\.swift$"

# Reporter type (xcode, json, csv, checkstyle, codeclimate, junit, html, sonarqube, markdown, github-actions-logging)
reporter: "github-actions-logging"
